name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      # O CI TEM de existir no SHA que a junta julga. PR de bloco conflita com a `main`
      # (todo bloco apensa nos mesmos registros), e sem `refs/pull/N/merge` o gatilho
      # `pull_request` não dispara: os PRs #388 e #389 foram julgados com ZERO check-runs.
      # Namespaces conferidos contra `git branch -r` real (B-SAN3-B1): `feature/` (78),
      # `codex/` (4) e `test/` (1) são convenção morta — o commit mais recente de cada um
      # é de 2026-06-19, 2026-05-26 e 2026-06-10. Os ramos vivos são estes quatro (§8.2).
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'
      - 'docs/**'
  workflow_dispatch:

# Agrupa por (workflow, tipo de evento, ref). NUNCA só por `github.ref`: em `pull_request`
# o ref é `refs/pull/N/merge` e em `push` é `refs/heads/<ramo>` — agrupar só por ref não
# dedupa nada. E agrupar por SHA CRUZANDO eventos faria um cancelar o outro, deixando o SHA
# julgado com check-run `cancelled`, que é exatamente o estado a eliminar.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # B-CI-PSQL16 — imagem FIXADA. Em 2026-10-19 o rótulo `ubuntu-latest` passou de ubuntu-24.04
    # (psql 16) para ubuntu-26.04 (psql 18.6): run verde 39235996352 (10:14Z, ubuntu-24.04) × run
    # vermelho 39342033007 (23:30Z, ubuntu-26.04). O T14a/b de `tests/san3-05-runtime-role-guard-db.test.ts`
    # executa o CLIENTE `psql` do sistema e exige a versão 16 — o teste descreve o psql 16 e não se
    # afrouxa. Só este job usa o `psql` do sistema (o `backend-postgres` não roda essa suíte), por isso
    # só ele é fixado. Ao migrar de imagem: instalar `postgresql-client-16` e pôr o bin dele à frente no PATH.
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_techsolutions?schema=public
      REDIS_URL: redis://localhost:6379
      # Ω-GATE: fixa o modo do gate. A suíte é verde em `memory` (default); testes que exigem o
      # caminho prisma setam CORE_SAAS_PERSISTENCE=prisma eles mesmos em runtime. Forçar aqui
      # elimina a fragilidade de o gate depender da AUSÊNCIA da var (um runner que herdasse
      # `prisma` veria falhas de poluição). Robustez pedida pela junta (critico J-SAN-1).
      CORE_SAAS_PERSISTENCE: memory

    # Ω-GATE: a suíte completa (testes *-prisma, rls-tenant-isolation, job-queue etc.) exige
    # Postgres e Redis reais. Sem estes service containers, `npm test` (suíte inteira) nunca
    # rodava de fato no CI — o gate era ilusório.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_techsolutions
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_techsolutions"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SAN2-2 §3.1(c) — O GUARD DO ESPELHO GANHA GUARDA. `.agents/agents/` é o espelho Codex de
      # `.claude/agents/` (D-INTEROP-CLAUDE-CODEX: "alterou um, altera o outro no mesmo PR"), mas
      # NENHUM job executava o `--check`: drift do espelho chegava à main sem ninguém ver. Roda logo
      # após a instalação e ANTES dos testes porque custa <1s e falha rápido. O runner é Linux, sem
      # autocrlf — o falso-vermelho de checkout no Windows não existe aqui, e a comparação passou a
      # ser eol-neutra de toda forma. SEM continue-on-error, SEM `|| true`: divergência REPROVA o PR.
      - name: Agents mirror guard (sync-agent-agents --check)
        run: node scripts/sync-agent-agents.mjs --check

      - name: Generate Prisma Client
        run: npm run db:generate

      # Ω-GATE: falha rápido se o banco não estiver no ambiente. Vários testes (auth/*-prisma/
      # persistent-rbac) leem DATABASE_URL no load do módulo e AUTO-SKIPAM se ausente — sem este
      # guard o gate poderia ficar verde-cego (suíte "passa" pulando cobertura real).
      - name: Guard required env
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL ausente — gate seria verde-cego"; exit 1; }
          test -n "$REDIS_URL" || { echo "REDIS_URL ausente"; exit 1; }

      - name: Apply migrations (Prisma)
        run: npx prisma migrate deploy

      - name: TypeScript check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # CHECK P1 PR-03 — SUBCONJUNTO DE ROTA CONTRA O POSTGRES (autorização do dono).
  #
  # POR QUE ESTE JOB EXISTE: o job `backend` roda a suíte inteira em `CORE_SAAS_PERSISTENCE=memory`,
  # onde o gate lê o catálogo EM CÓDIGO e o repositório é um `Map`. Divergência entre o que o código
  # declara e o que o BANCO aceita passa verde — foram três bugs graves da mesma família em dois dias
  # (CHECK de tipo desatualizado no #341; `checklist_runs:reopen` morta em produção; `field_technician`
  # sem permissão de checklist na tabela). Aqui o banco é PROVISIONADO (migrate + seed, como um ambiente
  # de verdade) e um subconjunto curado roda em `prisma`, batendo no Postgres por HTTP.
  #
  # O seed roda SÓ neste job, num banco descartável do runner — o job `backend` continua com o banco
  # migrado e vazio, sem mudança de comportamento para as demais suítes.
  backend-postgres:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_techsolutions?schema=public
      REDIS_URL: redis://localhost:6379
      CORE_SAAS_PERSISTENCE: prisma
      JWT_SECRET: dev-only-change-me
      JWT_EXPIRES_IN: 15m
      LOG_LEVEL: silent
      # ATIVA a paridade catálogo × banco SÓ aqui. `tests/permission-catalog-db-parity.test.ts` exige
      # um banco provisionado (migrate + seed, passo abaixo) e se declara pulado sem esta variável.
      # A versão anterior tentava DEDUZIR o provisionamento olhando se a tabela `roles` estava vazia —
      # sentinela que o paralelismo do `npm test` polui (várias suítes criam papéis), fazendo o teste
      # rodar contra um banco não semeado e reprovar o job `backend` de PRs sem relação com RBAC.
      RBAC_DB_PARITY: "1"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_techsolutions
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_techsolutions"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply migrations (Prisma)
        run: npx prisma migrate deploy

      # PROVISIONAMENTO: papéis/permissões vivem em TABELA. Sem o seed, `role_permissions` nasce vazia e
      # o guard de paridade não teria contra o que comparar (ele se declara pulado — e o passo seguinte
      # transforma esse pulo em falha).
      - name: Provision database (seed)
        run: npm run db:seed

      - name: Route suites against PostgreSQL
        run: |
          set -o pipefail
          SUITES="tests/checklist-routes-db.test.ts"
          SUITES="$SUITES tests/permission-catalog-db-parity.test.ts"
          SUITES="$SUITES tests/permission-catalog-migration-parity.test.ts"
          SUITES="$SUITES tests/checklist-applicability-schema-db.test.ts"
          SUITES="$SUITES tests/checklist-applicability-prisma-db.test.ts"
          SUITES="$SUITES tests/work-order-checklists-junction-schema-db.test.ts"
          SUITES="$SUITES tests/checklist-run-role-db.test.ts"
          SUITES="$SUITES tests/impound-checklist-link-autolink.test.ts"
          SUITES="$SUITES tests/checklist-template-prisma-db.test.ts"
          SUITES="$SUITES tests/checklist-run-lifecycle-db.test.ts"
          SUITES="$SUITES tests/checklist-run-create-concurrency-db.test.ts"
          SUITES="$SUITES tests/persistent-rbac-middleware.test.ts"
          # B-O6R-05 (Ω6R-DAT-001) — as metades prisma deste arquivo AUTO-PULAM sem DATABASE_URL, e é o
          # guard de zero pulos do passo seguinte que as pune se pularem. É aqui, contra o Postgres de
          # verdade, que "gravou numa instância, leu em outra" deixa de ser afirmação e vira execução.
          SUITES="$SUITES tests/core-saas-persistence-restart-db.test.ts"
          # B-O6R-01 ciclo 2 (R-B-O6R-01-ciclo1, B-4) — os DOIS pontos de validação do caminho PRISMA
          # (create/update de /users) provados por HTTP contra o Postgres: escalada de papel → 403,
          # controle positivo com manager, e banco sem assignment de plataforma depois do 403.
          SUITES="$SUITES tests/core-saas-role-authority-db.test.ts"
          # B-O6R-01 (Ω6R-SEC-001 + Ω6R-TEN-001) — identidade global: religação/desvínculo/normalização
          # sob role EFÊMERA NOSUPERUSER (o único arranjo em que o RLS existe), backfill nas duas
          # configurações, trilha append-only, função elevada e login sem organização de ponta a ponta.
          SUITES="$SUITES tests/auth-identity-links-db.test.ts"
          SUITES="$SUITES tests/auth-identity-revocation-db.test.ts"
          SUITES="$SUITES tests/auth-identity-role-real-db.test.ts"
          SUITES="$SUITES tests/auth-identity-backfill-db.test.ts"
          SUITES="$SUITES tests/auth-identity-link-events-db.test.ts"
          SUITES="$SUITES tests/auth-login-candidates-fn-db.test.ts"
          SUITES="$SUITES tests/auth-login-anonymous-db.test.ts"
          SUITES="$SUITES tests/auth-identity-exposure-scan.test.ts"
          # §8 do plano: rls-tenant-isolation entra na lista (estava ausente — rodava só no job backend,
          # onde se declara pulada sem DATABASE_URL; aqui o guard de zero pulos a pune se pular).
          SUITES="$SUITES tests/rls-tenant-isolation.test.ts"
          # SAN2-2 (item 2 de P-O6R-B02-SUITES-LIST-CI) — 4 suítes -db que EXISTEM na main e estavam fora da
          # lista curada: rodavam só no job "backend", onde auto-pulam em silêncio se o env quebrar (única
          # condição de skip delas) e o job fica verde. Cada uma foi medida ANTES de entrar: 3 execuções em
          # Postgres descartável, nas condições exatas deste job — 0 falha e 0 pulo nas 3, denominador
          # constante (3 + 5 + 6 + 8 = 22 casos). Agora sob o guard de zero pulos do passo seguinte.
          SUITES="$SUITES tests/impound-custody-history-db.test.ts"
          SUITES="$SUITES tests/vehicle-identity-merge-db.test.ts"
          SUITES="$SUITES tests/work-order-checklists-freeze-links-db.test.ts"
          SUITES="$SUITES tests/work-order-checklists-sticky-db.test.ts"
          # B-O6R-02 (Ω6R-DIN-008 / QUA-003) — close × writer com barreira sob Postgres real: o writer
          # bloqueia na trava SHARED de período e re-valida DENTRO da tx que grava (G10), e o close
          # espera writer em voo e o snapshot o inclui (G11). A suíte fixa CORE_SAAS_PERSISTENCE=prisma
          # ela mesma e asserta o modo (lição do #357).
          SUITES="$SUITES tests/financial-period-close-write-race-db.test.ts"
          # B-O6R-06 (Ω6R-DIN-005 / DIN-007) — as três suítes `-db` do faturamento da vistoria. Elas
          # auto-pulam DECLARANDO sem DATABASE_URL (no job `backend`), e é aqui, sob o guard de zero
          # pulos do passo seguinte, que a atomicidade da unidade faturável, o SUM/GROUP BY sem teto e
          # o rateio sob papel SEM BYPASSRLS deixam de ser afirmação e viram execução.
          SUITES="$SUITES tests/o6r06-usage-atomic-db.test.ts"
          SUITES="$SUITES tests/o6r06-usage-fault-injection.test.ts"
          SUITES="$SUITES tests/o6r06-cost-summary-sum-db.test.ts"
          SUITES="$SUITES tests/o6r06-allocation-basis-rls-db.test.ts"
          # B-O6R-02 F3–F5 (Ω6R-DIN-001/002/003 / QUA-003) — pagamento, estorno e cheque em transação
          # ÚNICA, provados com duas conexões e barreira determinística (fila de lock observada em
          # pg_stat_activity): G1/G2 perdedor 422 sem lançamento órfão + replay 409 sem mutação;
          # G3/G3b/G4 estorno devolve o pagamento e a dupla reversão morre no FOR UPDATE + re-check;
          # G5/G6 cheque intacto sob falha real e mutex 409 com invariante cleared ⇔ entry. Cada
          # suíte fixa CORE_SAAS_PERSISTENCE=prisma ela mesma e asserta o modo (lição do #357).
          SUITES="$SUITES tests/financial-pay-title-atomic-db.test.ts"
          SUITES="$SUITES tests/financial-entry-reverse-restore-db.test.ts"
          SUITES="$SUITES tests/cheque-clear-bounce-atomic-db.test.ts"
          # B-O6R-02 F6 (Ω6R-DIN-001..004/008 / QUA-003) — CAS de PATCH/DELETE,
          # status derivado no mesmo UPDATE, precedência de período/404 e CHECK 23514 (G7-G9).
          SUITES="$SUITES tests/financial-title-invariants-db.test.ts"
          # B-SAN3-20 — cheque vinculado liquida/restaura título na compensação/devolução;
          # CAS de estado do título e migração aditiva são provados no PostgreSQL real.
          SUITES="$SUITES tests/cheque-title-link-atomic-db.test.ts"
          SUITES="$SUITES tests/financial-title-status-cas-db.test.ts"
          SUITES="$SUITES tests/cheque-title-link-migration-drill-db.test.ts"
          # B-O6R-02 ciclo 2 · C3 (B-5 da J-B-O6R-02-ciclo1) — CONTROLE NEGATIVO da barreira das
          # suítes acima. Elas esperavam por statement bloqueado consultando pg_stat_activity
          # CLUSTER-WIDE, e este job roda os arquivos em PROCESSOS PARALELOS: um backend alheio
          # bloqueado satisfazia a espera. Agora a barreira é escopada por application_name, e esta
          # suíte prova as duas metades — bloqueio próprio satisfaz; decoy alheio real NÃO satisfaz.
          SUITES="$SUITES tests/pg-barrier-scoped-db.test.ts"
          # Fecha o LUGAR RESERVADO da main e P-O6R-B02-SUITES-LIST-CI, cujo dono é este PR.
          SUITES="$SUITES tests/financial-entry-delete-reverse-race-db.test.ts"
          # B-O6R-04a (Ω6R-DAT-002 / DAT-003 / P-020) — estoque sob concorrência, contra o Postgres real e sob
          # papéis efêmeros SEM BYPASSRLS: saldo nunca negativo em toda via que debita (T-A); fechamento de
          # contagem aplicado exatamente uma vez, retomável e com o total da sessão inteira (T-B); os dois
          # índices únicos parciais e o P2002 mapeado fora da transação (T-C); e o drill da migration numa base
          # PRÓPRIA, criada e derrubada pela suíte — o DDL nunca toca a base das irmãs (T-C′).
          SUITES="$SUITES tests/inventory-balance-lock-race-db.test.ts"
          SUITES="$SUITES tests/inventory-cycle-count-close-units-db.test.ts"
          SUITES="$SUITES tests/inventory-unique-backstops-db.test.ts"
          SUITES="$SUITES tests/inventory-migration-drill-db.test.ts"
          # B-TRC-01 ciclo 2 (J-B-TRC-01-ciclo1, (a)-1) — as seis suítes `-db` da ingestão do Traccar. Elas JÁ rodam no
          # job `backend` (medido no head 5abdf83b: 44/44 no log do run 38352262796), mas a convenção da lista curada
          # (SAN2-2, B-O6R-06) é que toda suíte `-db` nova entre AQUI, sob o guard de zero pulos, medida 3× antes.
          # Medido antes de entrar: 3 execuções na forma deste job, 0 falha, 0 pulo, denominador constante (6+9+2+20+6+5 = 48
          # casos nas 6 suítes).
          SUITES="$SUITES tests/traccar-binding-uniqueness-db.test.ts"
          SUITES="$SUITES tests/traccar-idempotency-db.test.ts"
          SUITES="$SUITES tests/traccar-ingest-pool-db.test.ts"
          SUITES="$SUITES tests/traccar-position-ingestion-db.test.ts"
          SUITES="$SUITES tests/traccar-quarantine-db.test.ts"
          SUITES="$SUITES tests/traccar-resolution-race-db.test.ts"
          # B-TRC-02 — as 4 suítes `-db` dos eventos e da telemetria veicular do Traccar (ingestão de evento, amostra no
          # savepoint, RLS, drill da migração por prefixo k = 1..17; variante Q1 = NÃO), medidas 3× nesta forma antes de entrar.
          # Medido antes de entrar (2026-10-20, container Linux, esta forma, 3×): 21+13+9+6 = 49 casos nas 4 suítes, 0 falha,
          # 0 pulo, denominador constante; o drill leva ~2 min. Total do job, medido 3× no ramo integrado: 463/463, 0 pulo.
          SUITES="$SUITES tests/traccar-event-ingestion-db.test.ts"
          SUITES="$SUITES tests/traccar-event-sample-db.test.ts"
          SUITES="$SUITES tests/traccar-event-rls-db.test.ts"
          SUITES="$SUITES tests/traccar-event-migration-drill-db.test.ts"
          # B-O6R-03a (Ω6R-DIN-009) — sync de despesas atômico e sem lançamento em dobro, contra o Postgres real e sob
          # papéis efêmeros SEM BYPASSRLS: claim + efeito + recibo + prova no mesmo commit (falha injetada nos três tipos),
          # corrida na PK com barreira escopada, a mesma ação reenviada por outro ator é conflito, recibo legado nunca
          # lança de novo e a chave interna é reconhecida por outro processo. Sem DATABASE_URL a suíte pula declarando.
          SUITES="$SUITES tests/expense-sync-atomic-db.test.ts"
          SUITES="$SUITES tests/work-order-invoicing-atomic-db.test.ts"
          SUITES="$SUITES tests/work-order-invoicing-migration-drill-db.test.ts"
          node --test --import tsx $SUITES 2>&1 | tee postgres-subset.tap

      # GUARD ANTI-VERDE-CEGO: todas essas suítes AUTO-PULAM sem DATABASE_URL/banco provisionado. Um pulo
      # aqui significaria "verde" sem ter exercido nada — o exato modo de falha que deixou os três bugs
      # passarem. Qualquer teste pulado derruba o job.
      - name: Fail on skipped tests (green-blind guard)
        run: |
          skipped=$(grep -E '^# skipped ' postgres-subset.tap | awk '{print $3}')
          echo "testes pulados: ${skipped:-desconhecido}"
          test -n "$skipped" || { echo "não consegui ler a contagem de pulos — tratando como falha"; exit 1; }
          test "$skipped" -eq 0 || { echo "suíte contra o Postgres PULOU $skipped teste(s) — gate seria verde-cego"; exit 1; }

  antivirus:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start ClamAV services by name
        run: |
          docker compose --profile av up -d --no-deps erp-clamav
          docker compose --profile av-limits up -d --no-deps erp-clamav-limits

      - name: Wait for healthy ClamAV services
        run: |
          deadline=$((SECONDS + 480))
          for service in erp-clamav erp-clamav-limits; do
            container_id=$(docker compose --profile av --profile av-limits ps -q "$service")
            test -n "$container_id" || { echo "$service não foi criado"; exit 1; }
            until test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy; do
              test "$SECONDS" -lt "$deadline" || {
                echo "timeout aguardando $service"
                docker compose --profile av --profile av-limits logs "$service"
                exit 1
              }
              sleep 5
            done
          done
          docker stats --no-stream

      - name: ClamAV real integration (no skips)
        env:
          AVREAL_CLAMAV_HOST: 127.0.0.1
          AVREAL_CLAMAV_LIMITS_PORT: "3311"
        run: node scripts/avreal-integration.mjs 2>&1 | tee antivirus.tap

      - name: Fail on skipped antivirus tests (green-blind guard)
        run: |
          skipped=$(grep -E '^# skipped ' antivirus.tap | awk '{print $3}')
          tests=$(grep -E '^# tests ' antivirus.tap | awk '{print $3}')
          echo "antivirus: tests=${tests:-desconhecido} skipped=${skipped:-desconhecido}"
          test -n "$tests" && test "$tests" -gt 0 || { echo "zero teste de antivírus"; exit 1; }
          test -n "$skipped" || { echo "não consegui ler a contagem de pulos"; exit 1; }
          test "$skipped" -eq 0 || { echo "integração antivírus pulou $skipped teste(s)"; exit 1; }

      - name: ClamAV diagnostics
        if: always()
        run: |
          docker compose --profile av --profile av-limits ps || true
          docker compose --profile av --profile av-limits logs --tail 200 erp-clamav erp-clamav-limits || true

      - name: Remove ClamAV containers
        if: always()
        run: docker compose --profile av --profile av-limits rm -s -f erp-clamav erp-clamav-limits

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: TypeScript check
        run: npm --prefix frontend run check

      - name: Smoke tests
        run: npm --prefix frontend run test:smoke

      - name: Build
        run: npm --prefix frontend run build

  # Ω5P PR-16 — owner-portal (PWA público ISOLADO). Build/typecheck próprios, fora de frontend/ (D-Ω5P-11).
  # Sem segredo no CI; sem backend embutido. O portal-app (BFF) já entra no job backend (npm run check/build).
  owner-portal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm --prefix portals/owner-portal ci

      - name: TypeScript check
        run: npm --prefix portals/owner-portal run check

      - name: Build
        run: npm --prefix portals/owner-portal run build

  # Ω5P PR-18a — authority-portal (2º PWA público ISOLADO). Build/typecheck próprios, fora de frontend/ (D-Ω5P-11).
  # Sem segredo no CI; sem backend embutido. O portal-app (BFF) já entra no job backend (npm run check/build).
  authority-portal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm --prefix portals/authority-portal ci

      - name: TypeScript check
        run: npm --prefix portals/authority-portal run check

      - name: Build
        run: npm --prefix portals/authority-portal run build

  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # VERSÃO FIXA, e subir é ato DELIBERADO (B-SAN3-B1). Com `channel: stable` sem
          # versão, o CI resolve o que o canal servir no dia — e derivou DENTRO desta rodada:
          # medido `stable-3.47.4` até 2026-09-18T18:37Z (runs 35380369290, 35381265287) e
          # `stable-3.47.5` a partir de 2026-09-19T00:26Z (run 35409352362), pelo caminho
          # `/opt/hostedtoolcache/flutter/stable-<versão>-x64` do log. Foi dessa deriva que
          # veio a divergência de `dart format` que deixou o CI vermelho no #388.
          flutter-version: 3.47.5

      - name: Install dependencies
        run: flutter pub get
        working-directory: mobile/flutter_app

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: mobile/flutter_app

      - name: Analyze
        run: flutter analyze
        working-directory: mobile/flutter_app

      - name: Tests
        run: flutter test --reporter compact
        working-directory: mobile/flutter_app

  # Ω-INFRA-1: builda a imagem do backend (valida o Dockerfile em todo PR) e publica no GHCR
  # com a tag do commit APENAS em push na main. Usa GITHUB_TOKEN (sem conta/segredo externo).
  #
  # B-O6R-05 (Q6 — decisão da junta CONTRA o planejador, que queria o smoke manual): este job passa a
  # RODAR o artefato que acabou de buildar. Buildar a imagem prova que o Dockerfile compila; só subir o
  # stack prova que o processo BOOTA — e é no boot que moram os dois P0 deste bloco (o agregado core-saas
  # em memória e o worker de jobs que nunca sobe). Um crítico registrou que a única linha que liga o
  # worker ao boot não tinha cobertura nenhuma; este passo é uma das duas provas dela.
  docker:
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O smoke de contêiner é um .mjs sem dependência; o runner já traz `node`, mas fixar a versão
      # aqui deixa este job com o mesmo Node dos demais em vez do que o runner escolher.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image (push to GHCR only on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/erp-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/erp-backend:latest
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # B-O6R-05 — o passo acima deixa a imagem no cache do buildx, não no daemon local: sem `load` não
      # existe imagem para o compose usar. Este passo REAPROVEITA as camadas (cache-from: gha, cache-to
      # ausente de propósito — nada novo a exportar) e só paga o custo de materializar a imagem no
      # daemon, para o smoke rodar contra o ARTEFATO DESTE COMMIT — nunca contra um rebuild diferente.
      - name: Load backend image into the local daemon (for the container smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: erp-techsolutions-api:ci-smoke
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha

      # O estágio `builder` é o que o serviço `migrate` do compose usa (prisma migrate deploy). Sem esta
      # pré-carga o compose rebuildaria o estágio inteiro no `up`; com ela, o compose encontra a imagem
      # com o nome default do projeto (<projeto>-<serviço>) e não builda nada. É otimização pura: se o
      # nome não bater em alguma versão do compose, ele simplesmente builda — o smoke não muda de veredito.
      - name: Load builder image for the compose migrate service
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: false
          load: true
          tags: erp-o6r-smoke-migrate:latest
          cache-from: type=gha

      # A PROVA DE CAMPO (§9): sobe o compose de produção, exige readiness COM o bloco do worker,
      # exige `/health/worker` dizendo "up" NO CORPO, grava uma organização, reinicia a api, prova que
      # o processo é outro, relê a organização e exige que ela tenha sobrevivido — e derruba tudo com
      # `-v`. Se este smoke passar com o worker desligado, ele não serve: por isso só `up` lido no
      # corpo é aceito (`not_expected` responde HTTP 200). O script recusa rodar contra qualquer alvo
      # cujo JWT_SECRET não seja o placeholder rotulado de validação local.
      - name: Container smoke — write → restart → read (persistência + worker)
        run: node scripts/smoke-compose-persistence.mjs
        env:
          API_IMAGE: erp-techsolutions-api:ci-smoke
          API_PORT: "3101"
          SMOKE_COMPOSE_BUILD: "0"
