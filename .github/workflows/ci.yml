name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_techsolutions?schema=public
      REDIS_URL: redis://localhost:6379
      # Ω-GATE: fixa o modo do gate. A suíte é verde em `memory` (default); testes que exigem o
      # caminho prisma setam CORE_SAAS_PERSISTENCE=prisma eles mesmos em runtime. Forçar aqui
      # elimina a fragilidade de o gate depender da AUSÊNCIA da var (um runner que herdasse
      # `prisma` veria falhas de poluição). Robustez pedida pela junta (critico J-SAN-1).
      CORE_SAAS_PERSISTENCE: memory

    # Ω-GATE: a suíte completa (testes *-prisma, rls-tenant-isolation, job-queue etc.) exige
    # Postgres e Redis reais. Sem estes service containers, `npm test` (suíte inteira) nunca
    # rodava de fato no CI — o gate era ilusório.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_techsolutions
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_techsolutions"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      # Ω-GATE: falha rápido se o banco não estiver no ambiente. Vários testes (auth/*-prisma/
      # persistent-rbac) leem DATABASE_URL no load do módulo e AUTO-SKIPAM se ausente — sem este
      # guard o gate poderia ficar verde-cego (suíte "passa" pulando cobertura real).
      - name: Guard required env
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL ausente — gate seria verde-cego"; exit 1; }
          test -n "$REDIS_URL" || { echo "REDIS_URL ausente"; exit 1; }

      - name: Apply migrations (Prisma)
        run: npx prisma migrate deploy

      - name: TypeScript check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # CHECK P1 PR-03 — SUBCONJUNTO DE ROTA CONTRA O POSTGRES (autorização do dono).
  #
  # POR QUE ESTE JOB EXISTE: o job `backend` roda a suíte inteira em `CORE_SAAS_PERSISTENCE=memory`,
  # onde o gate lê o catálogo EM CÓDIGO e o repositório é um `Map`. Divergência entre o que o código
  # declara e o que o BANCO aceita passa verde — foram três bugs graves da mesma família em dois dias
  # (CHECK de tipo desatualizado no #341; `checklist_runs:reopen` morta em produção; `field_technician`
  # sem permissão de checklist na tabela). Aqui o banco é PROVISIONADO (migrate + seed, como um ambiente
  # de verdade) e um subconjunto curado roda em `prisma`, batendo no Postgres por HTTP.
  #
  # O seed roda SÓ neste job, num banco descartável do runner — o job `backend` continua com o banco
  # migrado e vazio, sem mudança de comportamento para as demais suítes.
  backend-postgres:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_techsolutions?schema=public
      REDIS_URL: redis://localhost:6379
      CORE_SAAS_PERSISTENCE: prisma
      JWT_SECRET: dev-only-change-me
      JWT_EXPIRES_IN: 15m
      LOG_LEVEL: silent
      # ATIVA a paridade catálogo × banco SÓ aqui. `tests/permission-catalog-db-parity.test.ts` exige
      # um banco provisionado (migrate + seed, passo abaixo) e se declara pulado sem esta variável.
      # A versão anterior tentava DEDUZIR o provisionamento olhando se a tabela `roles` estava vazia —
      # sentinela que o paralelismo do `npm test` polui (várias suítes criam papéis), fazendo o teste
      # rodar contra um banco não semeado e reprovar o job `backend` de PRs sem relação com RBAC.
      RBAC_DB_PARITY: "1"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_techsolutions
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_techsolutions"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply migrations (Prisma)
        run: npx prisma migrate deploy

      # PROVISIONAMENTO: papéis/permissões vivem em TABELA. Sem o seed, `role_permissions` nasce vazia e
      # o guard de paridade não teria contra o que comparar (ele se declara pulado — e o passo seguinte
      # transforma esse pulo em falha).
      - name: Provision database (seed)
        run: npm run db:seed

      - name: Route suites against PostgreSQL
        run: |
          set -o pipefail
          SUITES="tests/checklist-routes-db.test.ts"
          SUITES="$SUITES tests/permission-catalog-db-parity.test.ts"
          SUITES="$SUITES tests/permission-catalog-migration-parity.test.ts"
          SUITES="$SUITES tests/checklist-applicability-schema-db.test.ts"
          SUITES="$SUITES tests/checklist-applicability-prisma-db.test.ts"
          SUITES="$SUITES tests/impound-checklist-link-autolink.test.ts"
          SUITES="$SUITES tests/checklist-template-prisma-db.test.ts"
          SUITES="$SUITES tests/checklist-run-lifecycle-db.test.ts"
          SUITES="$SUITES tests/checklist-run-create-concurrency-db.test.ts"
          SUITES="$SUITES tests/persistent-rbac-middleware.test.ts"
          node --test --import tsx $SUITES 2>&1 | tee postgres-subset.tap

      # GUARD ANTI-VERDE-CEGO: todas essas suítes AUTO-PULAM sem DATABASE_URL/banco provisionado. Um pulo
      # aqui significaria "verde" sem ter exercido nada — o exato modo de falha que deixou os três bugs
      # passarem. Qualquer teste pulado derruba o job.
      - name: Fail on skipped tests (green-blind guard)
        run: |
          skipped=$(grep -E '^# skipped ' postgres-subset.tap | awk '{print $3}')
          echo "testes pulados: ${skipped:-desconhecido}"
          test -n "$skipped" || { echo "não consegui ler a contagem de pulos — tratando como falha"; exit 1; }
          test "$skipped" -eq 0 || { echo "suíte contra o Postgres PULOU $skipped teste(s) — gate seria verde-cego"; exit 1; }

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: TypeScript check
        run: npm --prefix frontend run check

      - name: Smoke tests
        run: npm --prefix frontend run test:smoke

      - name: Build
        run: npm --prefix frontend run build

  # Ω5P PR-16 — owner-portal (PWA público ISOLADO). Build/typecheck próprios, fora de frontend/ (D-Ω5P-11).
  # Sem segredo no CI; sem backend embutido. O portal-app (BFF) já entra no job backend (npm run check/build).
  owner-portal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm --prefix portals/owner-portal ci

      - name: TypeScript check
        run: npm --prefix portals/owner-portal run check

      - name: Build
        run: npm --prefix portals/owner-portal run build

  # Ω5P PR-18a — authority-portal (2º PWA público ISOLADO). Build/typecheck próprios, fora de frontend/ (D-Ω5P-11).
  # Sem segredo no CI; sem backend embutido. O portal-app (BFF) já entra no job backend (npm run check/build).
  authority-portal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm --prefix portals/authority-portal ci

      - name: TypeScript check
        run: npm --prefix portals/authority-portal run check

      - name: Build
        run: npm --prefix portals/authority-portal run build

  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: mobile/flutter_app

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: mobile/flutter_app

      - name: Analyze
        run: flutter analyze
        working-directory: mobile/flutter_app

      - name: Tests
        run: flutter test --reporter compact
        working-directory: mobile/flutter_app

  # Ω-INFRA-1: builda a imagem do backend (valida o Dockerfile em todo PR) e publica no GHCR
  # com a tag do commit APENAS em push na main. Usa GITHUB_TOKEN (sem conta/segredo externo).
  docker:
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image (push to GHCR only on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/erp-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/erp-backend:latest
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
