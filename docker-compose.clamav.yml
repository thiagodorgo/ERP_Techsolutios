services:
  api:
    environment:
      EVIDENCE_SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_MAX_DB_AGE_HOURS: "72"
    networks:
      - default
      - clamav_private
    depends_on:
      clamav:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.4.6@sha256:982e28f90061d0e66eb03276419f589a47c9fa601e985e472fc2f6c64b497ca0
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    volumes:
      - clamav_db:/var/lib/clamav
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "test \"$(echo PING | nc 127.0.0.1 3310)\" = PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 6m
    mem_limit: 3g
    networks:
      - clamav_private

  clamav-freshclam:
    image: clamav/clamav:1.4.6@sha256:982e28f90061d0e66eb03276419f589a47c9fa601e985e472fc2f6c64b497ca0
    environment:
      CLAMAV_NO_CLAMD: "true"
      FRESHCLAM_CHECKS: "12"
    volumes:
      - clamav_db:/var/lib/clamav
      - ./infra/clamav/freshclam.updater.conf:/etc/clamav/freshclam.conf:ro
    networks:
      - clamav_update
    mem_limit: 2g
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x freshclam"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  clamav_db:

networks:
  clamav_private:
    internal: true
  clamav_update: {}
