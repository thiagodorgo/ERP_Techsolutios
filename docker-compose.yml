services:
  erp-postgres:
    image: postgres:16
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp_techsolutions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_techsolutions"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_techsolutions_local

  erp-redis:
    image: redis:7
    container_name: erp-redis
    ports:
      - "6379:6379"
    volumes:
      - erp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_techsolutions_local

  erp-clamav:
    image: clamav/clamav:1.4.7@sha256:ac15046e610610347c459afabea6683a52cd041c7a10adf5f050ebb05525d62d
    profiles: ["av"]
    entrypoint: ["/bin/sh", "-c", "cp /opt/avreal/erp-test.hdb /var/lib/clamav/erp-test.hdb && (freshclam --foreground --stdout || printf '%s\n' 'WARNING: freshclam inicial falhou; usando base da imagem' >&2) && exec /init"]
    ports:
      - "127.0.0.1:3310:3310"
    environment:
      CLAMAV_NO_FRESHCLAMD: ${AV_NO_FRESHCLAM:-false}
      FRESHCLAM_CHECKS: "12"
    volumes:
      - erp_clamav_db:/var/lib/clamav
      - ./infra/clamav/test-signatures/erp-test.hdb:/opt/avreal/erp-test.hdb:ro
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./infra/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "test \"$(echo PING | nc 127.0.0.1 3310)\" = PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 6m
    mem_limit: 3g
    networks:
      - erp_techsolutions_local

  erp-clamav-limits:
    image: clamav/clamav:1.4.7@sha256:ac15046e610610347c459afabea6683a52cd041c7a10adf5f050ebb05525d62d
    profiles: ["av-limits"]
    entrypoint: ["/bin/sh", "-c", "cp /opt/avreal/erp-test.hdb /var/lib/clamav/erp-test.hdb && exec /init"]
    ports:
      - "127.0.0.1:3311:3310"
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    volumes:
      - erp_clamav_limits_db:/var/lib/clamav
      - ./infra/clamav/test-signatures/erp-test.hdb:/opt/avreal/erp-test.hdb:ro
      - ./infra/clamav/clamd.limits-test.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "test \"$(echo PING | nc 127.0.0.1 3310)\" = PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 6m
    mem_limit: 3g
    networks:
      - erp_techsolutions_local

volumes:
  erp_postgres_data:
  erp_redis_data:
  erp_clamav_db:
  erp_clamav_limits_db:

networks:
  erp_techsolutions_local:
    name: erp_techsolutions_local
