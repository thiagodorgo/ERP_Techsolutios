services:
  erp-postgres:
    image: postgres:16
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp_techsolutions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_techsolutions"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_techsolutions_local

  erp-redis:
    image: redis:7
    container_name: erp-redis
    ports:
      - "6379:6379"
    volumes:
      - erp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_techsolutions_local

  erp-clamav:
    image: clamav/clamav:1.4.6@sha256:982e28f90061d0e66eb03276419f589a47c9fa601e985e472fc2f6c64b497ca0
    profiles: ["av"]
    ports:
      - "127.0.0.1:3310:3310"
    environment:
      CLAMAV_NO_FRESHCLAMD: ${AV_NO_FRESHCLAM:-false}
      FRESHCLAM_CHECKS: "12"
    volumes:
      - erp_clamav_db:/var/lib/clamav
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./infra/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 6m
    mem_limit: 3g
    networks:
      - erp_techsolutions_local

  erp-clamav-limits:
    image: clamav/clamav:1.4.6@sha256:982e28f90061d0e66eb03276419f589a47c9fa601e985e472fc2f6c64b497ca0
    profiles: ["av-limits"]
    ports:
      - "127.0.0.1:3311:3310"
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    volumes:
      - erp_clamav_limits_db:/var/lib/clamav
      - ./infra/clamav/clamd.limits-test.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 6m
    mem_limit: 3g
    networks:
      - erp_techsolutions_local

volumes:
  erp_postgres_data:
  erp_redis_data:
  erp_clamav_db:
  erp_clamav_limits_db:

networks:
  erp_techsolutions_local:
    name: erp_techsolutions_local
