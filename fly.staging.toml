# Ω-INFRA-2 — config-as-code do BACKEND em STAGING (Fly.io, região gru — D-INFRA-PROVIDER).
# Ativação viva (conta, `fly apps create`, secrets) = hand-off humano (dossiê). Nada de segredo aqui.
#
# Secrets exigidos (via `fly secrets set -c fly.staging.toml` OU GitHub Environment `staging`):
#   DATABASE_URL          → Postgres gerenciado (Fly MPG) de staging
#   REDIS_URL             → Redis (Upstash) de staging
#   JWT_SECRET            → segredo real (o gate do env.ts rejeita dev-secrets)
#   JWT_REFRESH_SECRET    → segredo real
#   CORS_ORIGIN           → allowlist https:// da origem web de staging. NÃO é segredo, mas NODE_ENV=production
#                           (abaixo) faz o gate do env.ts EXIGIR allowlist sem '*' — sem ela o boot FALHA de
#                           propósito (fail-closed). Ex.: https://erp-techsolutions-web-staging.fly.dev
#                           (regra geral: TODO ambiente com NODE_ENV=production, staging incluso, exige CORS_ORIGIN.)
#   PORTAL_SESSION_SECRET → segredo PRÓPRIO da sessão do owner-portal (≠ JWT_SECRET do ERP)
#   PORTAL_AUTHORITY_SESSION_SECRET → segredo PRÓPRIO da sessão do authority-portal (≠ ERP e ≠ owner)
#   PORTAL_LOG_SECRET     → segredo do HMAC do PortalAccessLog (≠ JWT_REFRESH_SECRET)
#   PORTAL_TENANT_ID      → binding de organização do deploy do portal. NÃO é segredo, mas é o id de uma
#                           organização real: fica fora do repositório por §2.8.
#   PORTAL_CORS_ORIGIN    → allowlist https:// da origem do portal público (mesma disciplina do CORS_ORIGIN).
# B-O6R-05 (Ω6R-DAT-001/DIN-006): os cinco PORTAL_* acima existiam no env.ts desde o Ω5P mas NÃO estavam
# nesta lista — quem provisionasse staging por ela teria o boot reprovado por 5 issues.
# Rollback do provisionamento: `fly apps destroy erp-techsolutions-api-staging` (app inteiro) ou
# `fly releases -c fly.staging.toml` + `fly deploy --image <imagem anterior do GHCR>` (só código).

app = "erp-techsolutions-api-staging"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Persistência real (B-O6R-05: o gate G1 do env.ts agora EXIGE "prisma" em todo NODE_ENV=production —
  # o compose local-prod, que usava `memory`, foi corrigido no mesmo bloco).
  CORE_SAAS_PERSISTENCE = "prisma"
  # B-O6R-05 (Ω6R-DIN-006) — sem esta flag o worker de jobs nunca sobe e nada é materializado. Gate G3.
  JOBS_WORKER_ENABLED = "true"
  JWT_EXPIRES_IN = "15m"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Staging pode escalar a zero fora de uso (custo); produção NÃO (min_machines_running >= 1 no PR6).
  min_machines_running = 0

  # Liveness RASO (sem I/O de dependência — blip de banco não derruba a máquina em cascata).
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/v1/health"

  # Readiness PROFUNDO (ping Postgres+Redis; 503 tira a máquina do balanceamento sem reiniciá-la).
  [[http_service.checks]]
    interval = "60s"
    timeout = "8s"
    grace_period = "45s"
    method = "GET"
    path = "/api/v1/health/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
