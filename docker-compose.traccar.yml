# B-TRC-01 — overlay de DEV do Traccar (plano v2.1 §6.1 e §8.3; D-TRC-PD-APROVADA-2026-10-11).
#
# Uso: SEMPRE junto do docker-compose.prod.yml e sob projeto fixo, nunca sozinho:
#   docker compose -p erp-trc01-demo    -f docker-compose.prod.yml -f docker-compose.traccar.yml …  (scripts/traccar-dev-demo.mjs)
#   docker compose -p erp-trc01-capture -f docker-compose.prod.yml -f docker-compose.traccar.yml …  (scripts/traccar-capture-fixture.mjs)
#
# Fronteiras (tests/traccar-dev-topology.test.ts):
#   - a 3200 (ingestão), a 5055 (OsmAnd) e a 8082 (web/REST do Traccar) NUNCA aparecem em `ports`;
#   - o que é publicado (api, web) fica só em 127.0.0.1;
#   - Traccar, simulador e captura só em redes `internal` (sem saída para a internet);
#   - a api escuta a 3200 só no IP fixo dela na `traccar_private` (TRACCAR_INGEST_HOST). A rede interna tem gateway
#     do lado do host, então do host Linux ou da VM do Docker Desktop esse IP é alcançável (A2-01): ali a barreira é
#     o segredo, sorteado a cada rodada do demo;
#   - o segredo do forward só entra por variável de ambiente e por interpolação OBRIGATÓRIA (`:?`).

networks:
  traccar_private:
    internal: true
    ipam:
      config:
        - subnet: ${TRC_PRIVATE_SUBNET:-172.31.250.0/24}
  traccar_devices:
    internal: true

services:
  api:
    networks:
      default: {}
      traccar_private:
        ipv4_address: ${TRC_API_PRIVATE_IP:-172.31.250.10}
    environment:
      TRACCAR_INGEST_ENABLED: "true"
      TRACCAR_INGEST_HOST: ${TRC_API_PRIVATE_IP:-172.31.250.10}
      TRACCAR_INGEST_PORT: "3200"
      TRACCAR_INSTANCE_KEY: erp-dev
      TRACCAR_FORWARD_SECRET_CURRENT: ${TRC_FORWARD_SECRET:?TRC_FORWARD_SECRET obrigatorio (o demo sorteia a cada rodada)}
    ports: !override
      - "127.0.0.1:${TRC_API_PORT:-3102}:3000"

  web:
    ports: !override
      - "127.0.0.1:${TRC_WEB_PORT:-18080}:8080"

  traccar:
    image: traccar/traccar:6.16.0@sha256:03ebb7ed2b219d4f25c326873bd022f5062f80bcae622a9d9422846b51951eda
    networks:
      - traccar_private
      - traccar_devices
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      FORWARD_URL: ${TRC_FORWARD_URL:-http://api:3200/ingest/traccar/v1/positions}
      FORWARD_HEADER: ${TRC_FORWARD_HEADER:?TRC_FORWARD_HEADER obrigatorio (o demo monta a partir do segredo da rodada)}
    volumes:
      - ./infra/traccar/dev/traccar.xml:/opt/traccar/conf/traccar.xml:ro

  # Simulador OsmAnd descartável: só alcança o Traccar (rede traccar_devices). Retenta só erro de conexão,
  # nunca depois de uma resposta HTTP. Imprime só o status.
  traccar-sim:
    image: node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
    profiles: ["tools"]
    networks:
      - traccar_devices
    environment:
      TRC_SIM_ID: ${TRC_SIM_ID:-trcdemo01}
      TRC_SIM_LAT: ${TRC_SIM_LAT:-}
      TRC_SIM_LON: ${TRC_SIM_LON:-}
      TRC_SIM_TIMESTAMP: ${TRC_SIM_TIMESTAMP:-}
      TRC_SIM_SPEED: ${TRC_SIM_SPEED:-0}
    command:
      - node
      - -e
      - |
        const params = new URLSearchParams({
          id: process.env.TRC_SIM_ID || "",
          lat: process.env.TRC_SIM_LAT || "",
          lon: process.env.TRC_SIM_LON || "",
          timestamp: process.env.TRC_SIM_TIMESTAMP || "",
          speed: process.env.TRC_SIM_SPEED || "0",
        });
        const url = "http://traccar:5055/?" + params.toString();
        const deadline = Date.now() + 90000;
        const retriable = new Set(["ECONNREFUSED", "ENOTFOUND", "EAI_AGAIN", "ECONNRESET", "EHOSTUNREACH"]);
        async function main() {
          for (;;) {
            try {
              const response = await fetch(url, { method: "GET", signal: AbortSignal.timeout(10000) });
              console.log("osmand_status=" + response.status);
              process.exit(response.ok ? 0 : 1);
            } catch (error) {
              const code = error && error.cause && error.cause.code;
              if (!retriable.has(code) || Date.now() > deadline) {
                console.log("osmand_error=" + (code || "unknown"));
                process.exit(2);
              }
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }
          }
        }
        main();

  # Receptor de captura da fixture (scripts/traccar-capture-fixture.mjs): só na traccar_private, recebe na 3200,
  # responde 204 e imprime o corpo e só os NOMES dos headers (nunca os valores).
  traccar-capture:
    image: node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
    profiles: ["capture"]
    networks:
      - traccar_private
    command:
      - node
      - -e
      - |
        const http = require("node:http");
        const server = http.createServer((request, response) => {
          const chunks = [];
          request.on("data", (chunk) => chunks.push(chunk));
          request.on("end", () => {
            console.log("TRC_CAPTURE_HEADERS " + JSON.stringify(Object.keys(request.headers).sort()));
            console.log("TRC_CAPTURE_BODY " + Buffer.concat(chunks).toString("utf8"));
            response.statusCode = 204;
            response.end();
          });
        });
        server.listen(3200, "0.0.0.0", () => console.log("TRC_CAPTURE_READY"));
